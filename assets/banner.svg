<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#111c2e" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Mesh Wireframe Glow -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Radial Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <!-- Pulse Animation -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .floating-node-rev { animation: floatSlow 7s ease-in-out infinite reverse; }
      .glowing-element { animation: pulseGlow 4s ease-in-out infinite; }
      .network-line { stroke-dasharray: 6, 6; animation: dashMove 3s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="url(#orbCyan)" class="glowing-element" />
  <circle cx="1020" cy="300" r="220" fill="url(#orbPurple)" class="glowing-element" />
  <circle cx="600" cy="380" r="160" fill="url(#orbTeal)" class="glowing-element" />

  <!-- Dynamic Decorative Network/Asset Nodes (Behind Text) -->
  <g opacity="0.45">
    <line x1="120" y1="80" x2="300" y2="140" stroke="url(#lineGrad)" stroke-width="1.5" class="network-line" />
    <line x1="300" y1="140" x2="480" y2="70" stroke="url(#lineGrad)" stroke-width="1.5" />
    <line x1="720" y1="360" x2="900" y2="280" stroke="url(#lineGrad)" stroke-width="1.5" class="network-line" />
    <line x1="900" y1="280" x2="1080" y2="340" stroke="url(#lineGrad)" stroke-width="1.5" />
    
    <!-- Left floating node card -->
    <g class="floating-node" transform="translate(80, 240)">
      <rect width="160" height="60" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="26" cy="30" r="8" fill="#38bdf8" />
      <text x="44" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ASSET DISCOVERY</text>
      <text x="44" y="43" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">100% AUDITED</text>
    </g>

    <!-- Right floating node card -->
    <g class="floating-node-rev" transform="translate(960, 100)">
      <rect width="160" height="60" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="26" cy="30" r="8" fill="#818cf8" />
      <text x="44" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">INVENTORY &amp; SAM</text>
      <text x="44" y="43" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">ACTIVE LIFECYCLE</text>
    </g>
  </g>

  <!-- Foreground Content: Title, Subtitle, & Tagline (Always Clean & Visible) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-118" cy="0" r="5" fill="#10b981" />
      <text x="8" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ITAM &amp; ASSET SUITES</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Awesome Asset Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
      Enterprise ITAM, SAM &amp; CMDB Platforms • Open-Source &amp; SaaS Solutions
    </text>

    <!-- Tagline & Description -->
    <text x="600" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">
      Verified pricing benchmarks, free tier limits, company valuations, and self-hosted open-source software
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(600, 320)">
      <!-- Badge 1: Hardware & Software ITAM -->
      <g transform="translate(-310, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📦 Hardware &amp; ITAM</text>
      </g>
      <!-- Badge 2: SaaS & License Tracking -->
      <g transform="translate(-105, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 SAM &amp; Compliance</text>
      </g>
      <!-- Badge 3: CMDB & Infrastructure -->
      <g transform="translate(105, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🖥️ CMDB &amp; IPAM</text>
      </g>
      <!-- Badge 4: Open Source -->
      <g transform="translate(310, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 Self-Hosted FOSS</text>
      </g>
    </g>
  </g>
</svg>
